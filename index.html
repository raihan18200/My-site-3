<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Versus: Ultimate Arena ⚔️</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #06060c; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        h1 { color: #ff4757; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(255, 71, 87, 0.6); font-size: 2rem; text-align: center; }
        .subtitle { color: #888; margin-bottom: 15px; font-size: 0.9rem; }

        /* Top Controls */
        .top-controls { display: flex; gap: 10px; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .search-box { flex: 1; padding: 12px; background: #11111e; border: 1px solid #333; border-radius: 25px; color: #fff; outline: none; font-size: 0.9rem; padding-left: 20px; }
        .lang-btn { background: #ff4757; color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .lang-btn:hover { background: #ff6b81; }

        /* Battle Ground Layout */
        .arena { display: flex; flex-direction: column; width: 100%; max-width: 600px; gap: 15px; align-items: center; }
        
        .fighter-box { width: 100%; background: #11111e; border: 2px solid #222; border-radius: 15px; padding: 20px; text-align: center; transition: 0.3s; }
        #box1 { border-left: 5px solid #00d2d3; box-shadow: 0 0 15px rgba(0, 210, 211, 0.1); }
        #box2 { border-right: 5px solid #ff4757; box-shadow: 0 0 15px rgba(255, 71, 87, 0.1); }
        
        .vs-text { font-size: 1.8rem; font-weight: bold; color: #ffa502; text-shadow: 0 0 10px rgba(255, 165, 2, 0.5); margin: 5px 0; }

        select { width: 100%; padding: 12px; background: #1c1c2e; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 1rem; outline: none; cursor: pointer; }
        
        /* Fight Button */
        .fight-btn { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none; padding: 15px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4); transition: 0.3s; text-transform: uppercase; width: 100%; }
        .fight-btn:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(255, 71, 87, 0.6); }

        /* Result Display */
        .result-screen { display: none; width: 100%; max-width: 600px; background: #1e1e30; border: 2px solid #ffa502; border-radius: 15px; padding: 20px; margin-top: 20px; text-align: center; animation: fadeIn 0.5s ease-in-out; }
        .winner-title { font-size: 1.5rem; color: #2ed573; font-weight: bold; margin-bottom: 10px; }
        .battle-log { font-size: 0.95rem; color: #ccc; line-height: 1.6; text-align: justify; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Shake Animation for Battle Effect */
        .shake { animation: shakeEffect 0.5s infinite; }
        @keyframes shakeEffect {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <h1>Anime Versus</h1>
    <p class="subtitle">The Ultimate Arena Simulation</p>

    <div class="top-controls">

        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">EN</button>
    </div>

    <div class="arena" id="arena">

        </div>

        <div class="vs-text">V S</div>

        <div class="fighter-box" id="box2">

            <select id="fighter2" onchange="resetResult()"></select>
        </div>

        <button class="fight-btn" id="fightBtn" onclick="startBattle()">যুদ্ধ শুরু করুন! (FIGHT)</button>
    </div>

    <div class="result-screen" id="resultScreen">

        <p class="battle-log" id="battleLog"></p>

        // ড্রপডাউন মেনু ডাটা দিয়ে ফিল্ডআপ করা
        function initSelectors(dataList = Object.keys(characters)) {
            const f1 = document.getElementById('fighter1');
            const f2 = document.getElementById('fighter2');
            
            let options = "";
            dataList.forEach(name => {
                options += `<option value="${name}">${name} (${characters[name].anime})</option>`;
            });
            
            f1.innerHTML = options || `<option>No character found</option>`;
            f2.innerHTML = options || `<option>No character found</option>`;
            
            if (dataList.length > 1) f2.selectedIndex = 1; // Fighter 2 তে দ্বিতীয় ক্যারেক্টার ডিফল্ট রাখা
        }

        // সার্চ এবং ফিল্টার সিস্টেম
        function filterCharacters() {
            const searchVal = document.getElementById('search').value.toLowerCase();
            const filteredNames = Object.keys(characters).filter(name => 
                name.toLowerCase().includes(searchVal) || characters[name].anime.toLowerCase().includes(searchVal)
            );
            initSelectors(filteredNames);
            resetResult();
        }

        // ভাষা পরিবর্তন (Toggle Language)
        function toggleLanguage() {
            const btn = document.getElementById('langBtn');
            const bCorner = document.getElementById('blueCorner');
            const rCorner = document.getElementById('redCorner');
            const fBtn = document.getElementById('fightBtn');

            if (currentLang === 'bn') {
                currentLang = 'en';
                btn.innerText = 'বাং';
                bCorner.innerText = 'BLUE CORNER';
                rCorner.innerText = 'RED CORNER';
                fBtn.innerText = 'FIGHT';
            } else {
                currentLang = 'bn';
                btn.innerText = 'EN';
                bCorner.innerText = 'ব্লু কর্নার (BLUE CORNER)';
                rCorner.innerText = 'রেড কর্নার (RED CORNER)';
                fBtn.innerText = 'যুদ্ধ শুরু করুন! (FIGHT)';
            }
            resetResult();
        }

        function resetResult() {
            document.getElementById('resultScreen').style.display = 'none';
        }

        // ব্যাটল শুরু এবং ভাইব্রেশন ইফেক্ট
        function startBattle() {
            const name1 = document.getElementById('fighter1').value;
            const name2 = document.getElementById('fighter2').value;
            const arena = document.getElementById('arena');
            const resScreen = document.getElementById('resultScreen');

            if (!characters[name1] || !characters[name2] || name1 === name2) {
                alert(currentLang === 'bn' ? "দয়া করে দুজন আলাদা ফাইটার সিলেক্ট করুন!" : "Please select two different fighters!");
                return;
            }

            // মোবাইল ভাইব্রেশন হ্যাপটিক ফিডব্যাক (যদি ডিভাইস সাপোর্ট করে)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }

            // ফাইট অ্যানিমেশন (স্ক্রিন কাঁপবে)
            arena.classList.add('shake');
            resScreen.style.display = 'none';

            setTimeout(() => {
                arena.classList.remove('shake');
                calculateWinner(name1, name2);
            }, 1000); 
        }

        // বিজয়ী নির্ধারণের মূল লজিক
        function calculateWinner(p1, p2) {
            const c1 = characters[p1];
            const c2 = characters[p2];

            // পাওয়ার হিসাব + সামান্য র্যান্ডম লাক ফ্যাক্টর
            const score1 = (c1.atk * 1.2) + (c1.def * 0.8) + (c1.spd * 1.0) + (Math.random() * 15);
            const score2 = (c2.atk * 1.2) + (c2.def * 0.8) + (c2.spd * 1.0) + (Math.random() * 15);

            let winner = "";
            let reason = "";

            if (score1 > score2) {
                winner = p1;
                reason = currentLang === 'bn' ? c1.bn : c1.en;
            } else {
                winner = p2;
                reason = currentLang === 'bn' ? c2.bn : c2.en;
            }

            const winPrefix = currentLang === 'bn' ? `🏆 বিজয়ী: ${winner} 🎉` : `🏆 WINNER: ${winner} 🎉`;
            
            document.getElementById('winnerText').innerText = winPrefix;
            document.getElementById('battleLog').innerText = reason;
            document.getElementById('resultScreen').style.display = 'block';
            
            // উইনার ঘোষণার পর আবার একটা ফাইনাল লং ভাইব্রেশন
            if (navigator.vibrate) {
                navigator.vibrate(300);
            }
        }

        // পেজ লোড হলে সিলেক্টর চালু হবে
        initSelectors();
    </script>
